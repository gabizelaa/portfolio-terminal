<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="description" content="Terminal interativo da Gabizela - Portfolio em formato de terminal" />
    <meta name="theme-color" content="#5223fa" />

    <title>Gabizela Terminal - Portfolio Interativo</title>

    <link
      rel="icon"
      href="/assets/images/gabizela-icon.ico"
      type="image/icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <div class="theme-toggle-container">
      <button 
        id="theme-toggle" 
        class="theme-toggle-btn" 
        aria-label="Alternar tema"
        title="Alternar entre tema claro e escuro"
      >
        <span class="theme-icon">🌙</span>
      </button>
    </div>

    <main id="terminal" class="terminal-container">
      <header id="logo" class="terminal-header" role="banner"></header>
      
      <section class="terminal-info" role="complementary">
        <div id="date-time" class="datetime-container">
          <p id="time" aria-live="polite"></p>
          <p id="date" aria-live="polite"></p>
          <p>Gabizela Corporation. Todos os direitos reservados.</p>
          <p>Iniciando terminal...</p>
          <p>Digite "help" para ver a lista de comandos</p>
        </div>
      </section>
      
      <section 
        id="output" 
        class="terminal-output" 
        role="log" 
        aria-live="polite"
        aria-label="Saída do terminal"
      ></section>

      <section id="input" class="terminal-input" role="form">
        <label for="command-input" class="visually-hidden">Comando do terminal</label>
        <span class="prompt" aria-hidden="true">&lt;C:\users\u&gt;</span>
        <input 
          type="text" 
          id="command-input" 
          class="command-input"
          autofocus 
          autocomplete="off"
          spellcheck="false"
          aria-describedby="help-text"
        />
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./js/script.js"></script>
    <script type="module" src="./js/ascii.js"></script>
  </body>
</html>
